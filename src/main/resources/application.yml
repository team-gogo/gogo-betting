server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: gogo-betting
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-circular-references: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  data:
    redis:
      host: ${REDIS_HOST:redis.infra.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.infra.svc.cluster.local:9092}
    consumer:
      group-id: gogo
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            use:
              type:
                headers: "false"
            trusted:
              packages: "*"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual
      poll-timeout: 5000

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

clients:
  stage:
    url: ${STAGE_URL:http://gogo-stage.gogo.svc.cluster.local}
  user:
    url: ${USER_URL:http://gogo-user.gogo.svc.cluster.local}

security:
  internal:
    serverToServerIp: ${SERVER_TO_SERVER_IP}
    serverToServerSubnet: ${SERVER_TO_SERVER_SUBNET}
